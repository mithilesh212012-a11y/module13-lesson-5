<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        #display {
            font-size: 40px;
            margin: 20px;
            color: blue;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <button onclick="startWatch()">Start</button>
    <button onclick="stopWatch()">Stop</button>
    <button onclick="resetWatch()">Reset</button>

    <script>
        let seconds = 0;
        let minutes = 0;
        let hours = 0;
        let timer = null;

        function updateDisplay() {
            let h = String(hours).padStart(2, '0');
            let m = String(minutes).padStart(2, '0');
            let s = String(seconds).padStart(2, '0');

            document.getElementById("display").innerHTML =
                h + ":" + m + ":" + s;
        }

        function startWatch() {
            if (timer !== null) return;

            timer = setInterval(function () {
                seconds++;

                if (seconds === 60) {
                    seconds = 0;
                    minutes++;
                }

                if (minutes === 60) {
                    minutes = 0;
                    hours++;
                }

                updateDisplay();
            }, 1000);
        }

        function stopWatch() {
            clearInterval(timer);
            timer = null;
        }

        function resetWatch() {
            clearInterval(timer);
            timer = null;

            seconds = 0;
            minutes = 0;
            hours = 0;

            updateDisplay();
        }
    </script>

</body>
</html>
