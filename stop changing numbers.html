<!DOCTYPE html>
<html>
<head>
    <title>Rolling Dice App</title>
    <style>
        body{
            text-align:center;
            font-family:Arial;
            margin-top:100px;
        }

        #number{
            font-size:60px;
            color:blue;
            margin:20px;
        }

        button{
            padding:10px 20px;
            font-size:18px;
        }
    </style>
</head>
<body>

    <h1>Rolling Dice</h1>

    <div id="number">1</div>

    <button onclick="toggleRoll()">Start / Stop</button>

    <script>
        let timer;
        let clickCount = 0;

        // Start rolling immediately
        timer = setInterval(changeNumber, 100);

        function changeNumber() {
            let randomNum = Math.floor(Math.random() * 6) + 1;
            document.getElementById("number").innerHTML = randomNum;
        }

        function toggleRoll() {
            clickCount++;

            if (clickCount % 2 !== 0) {
                // Odd click - Stop
                clearInterval(timer);
            } else {
                // Even click - Start
                timer = setInterval(changeNumber, 100);
            }
        }
    </script>

</body>
</html>
